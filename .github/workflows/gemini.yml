name: GEMINI-V2RAY-20

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:

      # =========================================================
      # Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # Install tools
      # =========================================================
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl unzip

      # =========================================================
      # Install Xray
      # =========================================================
      - name: Install Xray
        run: |
          XRAY_VERSION="v26.7.11"

          curl -fL \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip" \
            -o xray.zip

          unzip -q xray.zip -d xray

          chmod +x xray/xray

          ./xray/xray version

      # =========================================================
      # Download configurations
      # =========================================================
      - name: Download subscription
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" \
            -o all.txt

          sed -i '/^[[:space:]]*$/d' all.txt

          echo "Total source configurations:"
          wc -l all.txt

      # =========================================================
      # Filter candidates
      #
      # We only need 20 final servers.
      # Test up to 300 good candidates.
      # =========================================================
      - name: Filter candidates
        run: |

          > candidates.txt

          while IFS= read -r line; do

            case "$line" in
              vless://*|vmess://*|trojan://*)
                ;;
              *)
                continue
                ;;
            esac

            score=0

            # ---------------------------------------------------
            # Port 443
            # ---------------------------------------------------
            if echo "$line" | grep -qiE \
              '(:443([/?#]|$)|port=443|%3A443)'; then
              score=$((score + 50))
            fi

            # ---------------------------------------------------
            # TLS
            # ---------------------------------------------------
            if echo "$line" | grep -qiE \
              'security=tls|security=reality|tlsSettings|tls'; then
              score=$((score + 30))
            fi

            # ---------------------------------------------------
            # Reality
            # ---------------------------------------------------
            if echo "$line" | grep -qiE \
              'reality|pbk=|publickey='; then
              score=$((score + 20))
            fi

            # ---------------------------------------------------
            # WebSocket
            # ---------------------------------------------------
            if echo "$line" | grep -qiE \
              'type=ws|network=ws|websocket|wsSettings'; then
              score=$((score + 10))
            fi

            # ---------------------------------------------------
            # gRPC
            # ---------------------------------------------------
            if echo "$line" | grep -qiE \
              'type=grpc|network=grpc|grpc'; then
              score=$((score + 10))
            fi

            # ---------------------------------------------------
            # Candidate
            # ---------------------------------------------------
            if [ "$score" -ge 50 ]; then
              echo "$score|$line" >> candidates.txt
            fi

          done < all.txt

          sort -t'|' -k1,1nr candidates.txt \
            | head -n 300 \
            > candidates_300.txt

          echo "Candidates selected for testing:"
          wc -l candidates_300.txt

      # =========================================================
      # Create Xray configuration parser
      # =========================================================
      - name: Create parser
        run: |

          cat > make_config.py <<'PY'
          import sys
          import json
          import base64
          import urllib.parse

          if len(sys.argv) < 3:
              sys.exit(1)

          uri = sys.argv[1]
          local_port = int(sys.argv[2])

          def b64decode(s):
              s = s.strip()
              s += "=" * ((4 - len(s) % 4) % 4)
              return base64.urlsafe_b64decode(s).decode()

          # =====================================================
          # VMESS
          # =====================================================
          if uri.startswith("vmess://"):

              raw = uri[8:]

              try:
                  data = json.loads(b64decode(raw))
              except Exception:
                  sys.exit(1)

              address = data.get("add", "")
              port = int(data.get("port", 443))
              uuid = data.get("id", "")
              network = data.get("net", "tcp")
              tls = data.get("tls", "")
              host = data.get("host", "")
              path = data.get("path", "")
              sni = data.get("sni", host)

              if not address or not uuid:
                  sys.exit(1)

              stream = {
                  "network": network,
                  "security": "tls" if tls else "none"
              }

              if network == "ws":

                  stream["wsSettings"] = {
                      "path": path or "/"
                  }

                  if host:
                      stream["wsSettings"]["headers"] = {
                          "Host": host
                      }

              if tls:

                  stream["tlsSettings"] = {
                      "serverName": sni or address,
                      "allowInsecure": False,
                      "fingerprint": "chrome"
                  }

              config = {
                  "log": {
                      "loglevel": "error"
                  },

                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": local_port,
                      "protocol": "socks",

                      "settings": {
                          "udp": False
                      }
                  }],

                  "outbounds": [{
                      "protocol": "vmess",

                      "settings": {
                          "vnext": [{
                              "address": address,
                              "port": port,

                              "users": [{
                                  "id": uuid,
                                  "alterId": int(data.get("aid", 0)),
                                  "security": "auto"
                              }]
                          }]
                      },

                      "streamSettings": stream
                  }]
              }

          # =====================================================
          # VLESS
          # =====================================================
          elif uri.startswith("vless://"):

              try:
                  p = urllib.parse.urlparse(uri)

                  uuid = p.username
                  address = p.hostname
                  port = p.port or 443

                  q = urllib.parse.parse_qs(p.query)

              except Exception:
                  sys.exit(1)

              if not uuid or not address:
                  sys.exit(1)

              network = q.get(
                  "type",
                  ["tcp"]
              )[0]

              security = q.get(
                  "security",
                  ["none"]
              )[0]

              stream = {
                  "network": network,
                  "security": security
              }

              # -------------------------------------------------
              # TLS
              # -------------------------------------------------
              if security == "tls":

                  sni = q.get(
                      "sni",
                      [address]
                  )[0]

                  stream["tlsSettings"] = {
                      "serverName": sni,
                      "allowInsecure": False,
                      "fingerprint": q.get(
                          "fp",
                          ["chrome"]
                      )[0]
                  }

              # -------------------------------------------------
              # Reality
              # -------------------------------------------------
              elif security == "reality":

                  sni = q.get(
                      "sni",
                      [""]
                  )[0]

                  pbk = q.get(
                      "pbk",
                      [""]
                  )[0]

                  sid = q.get(
                      "sid",
                      [""]
                  )[0]

                  if not pbk or not sni:
                      sys.exit(1)

                  stream["realitySettings"] = {
                      "fingerprint": q.get(
                          "fp",
                          ["chrome"]
                      )[0],

                      "serverName": sni,

                      "publicKey": pbk,

                      "shortId": sid,

                      "spiderX": q.get(
                          "spx",
                          [""]
                      )[0]
                  }

              # -------------------------------------------------
              # WebSocket
              # -------------------------------------------------
              if network == "ws":

                  stream["wsSettings"] = {
                      "path": q.get(
                          "path",
                          ["/"]
                      )[0]
                  }

                  host = q.get(
                      "host",
                      [""]
                  )[0]

                  if host:

                      stream["wsSettings"]["headers"] = {
                          "Host": host
                      }

              # -------------------------------------------------
              # gRPC
              # -------------------------------------------------
              elif network == "grpc":

                  stream["grpcSettings"] = {
                      "serviceName": q.get(
                          "serviceName",
                          [""]
                      )[0]
                  }

              user = {
                  "id": uuid,
                  "encryption": "none"
              }

              flow = q.get(
                  "flow",
                  [""]
              )[0]

              if flow:
                  user["flow"] = flow

              config = {
                  "log": {
                      "loglevel": "error"
                  },

                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": local_port,
                      "protocol": "socks",

                      "settings": {
                          "udp": False
                      }
                  }],

                  "outbounds": [{
                      "protocol": "vless",

                      "settings": {
                          "vnext": [{
                              "address": address,
                              "port": port,
                              "users": [user]
                          }]
                      },

                      "streamSettings": stream
                  }]
              }

          # =====================================================
          # TROJAN
          # =====================================================
          elif uri.startswith("trojan://"):

              try:
                  p = urllib.parse.urlparse(uri)

                  password = urllib.parse.unquote(
                      p.username or ""
                  )

                  address = p.hostname
                  port = p.port or 443

                  q = urllib.parse.parse_qs(
                      p.query
                  )

              except Exception:
                  sys.exit(1)

              if not address or not password:
                  sys.exit(1)

              sni = q.get(
                  "sni",
                  [address]
              )[0]

              network = q.get(
                  "type",
                  ["tcp"]
              )[0]

              stream = {
                  "network": network,
                  "security": "tls",

                  "tlsSettings": {
                      "serverName": sni,
                      "allowInsecure": False,
                      "fingerprint": q.get(
                          "fp",
                          ["chrome"]
                      )[0]
                  }
              }

              if network == "ws":

                  stream["wsSettings"] = {
                      "path": q.get(
                          "path",
                          ["/"]
                      )[0]
                  }

                  host = q.get(
                      "host",
                      [""]
                  )[0]

                  if host:
                      stream["wsSettings"]["headers"] = {
                          "Host": host
                      }

              config = {
                  "log": {
                      "loglevel": "error"
                  },

                  "inbounds": [{
                      "listen": "127.0.0.1",
                      "port": local_port,
                      "protocol": "socks",

                      "settings": {
                          "udp": False
                      }
                  }],

                  "outbounds": [{
                      "protocol": "trojan",

                      "settings": {
                          "servers": [{
                              "address": address,
                              "port": port,
                              "password": password
                          }]
                      },

                      "streamSettings": stream
                  }]
              }

          else:
              sys.exit(1)

          print(
              json.dumps(
                  config,
                  ensure_ascii=False
              )
          )
          PY

      # =========================================================
      # Create tester
      #
      # Every test receives its own SOCKS port.
      # =========================================================
      - name: Create tester
        run: |

          cat > test_one.sh <<'SH'
          #!/bin/bash

          set +e

          input="$1"
          id="$2"

          # Every Xray gets a unique local port.
          PORT=$((20000 + id))

          score=$(echo "$input" | cut -d'|' -f1)
          uri=$(echo "$input" | cut -d'|' -f2-)

          mkdir -p test_configs

          config="test_configs/${id}.json"
          logfile="test_configs/${id}.log"

          cleanup() {

            if [ -n "$pid" ]; then
              kill "$pid" 2>/dev/null
              wait "$pid" 2>/dev/null
            fi

            rm -f "$config"
            rm -f "$logfile"
            rm -f "test_configs/${id}.code"
          }

          trap cleanup EXIT

          # -----------------------------------------------------
          # Create config
          # -----------------------------------------------------
          python3 make_config.py \
            "$uri" \
            "$PORT" \
            > "$config" 2>/dev/null

          if [ ! -s "$config" ]; then
            exit 1
          fi

          # -----------------------------------------------------
          # Validate config
          # -----------------------------------------------------
          ./xray/xray run \
            -test \
            -config "$config" \
            >/dev/null 2>&1

          if [ $? -ne 0 ]; then
            exit 1
          fi

          # -----------------------------------------------------
          # Start Xray
          # -----------------------------------------------------
          ./xray/xray run \
            -config "$config" \
            > "$logfile" 2>&1 &

          pid=$!

          # -----------------------------------------------------
          # Wait for SOCKS port
          # -----------------------------------------------------
          for n in 1 2 3 4 5; do

            if curl \
              --socks5-hostname "127.0.0.1:${PORT}" \
              --connect-timeout 1 \
              --max-time 2 \
              -o /dev/null \
              -s \
              https://www.google.com/ \
              >/dev/null 2>&1
            then
              break
            fi

            sleep 1

          done

          # -----------------------------------------------------
          # Gemini connectivity test
          # -----------------------------------------------------
          for attempt in 1 2 3; do

            code=$(curl \
              --socks5-hostname "127.0.0.1:${PORT}" \
              --connect-timeout 2 \
              --max-time 5 \
              -o /dev/null \
              -s \
              -w "%{http_code}" \
              https://generativelanguage.googleapis.com/ \
              2>/dev/null)

            if [ "$code" != "000" ] && [ -n "$code" ]; then

              # -------------------------------------------------
              # Measure latency
              # -------------------------------------------------
              latency=$(curl \
                --socks5-hostname "127.0.0.1:${PORT}" \
                --connect-timeout 2 \
                --max-time 5 \
                -o /dev/null \
                -s \
                -w "%{time_total}" \
                https://generativelanguage.googleapis.com/ \
                2>/dev/null)

              if [ -z "$latency" ]; then
                latency="99"
              fi

              echo "$score|$latency|$code|$uri"

              exit 0
            fi

            sleep 1

          done

          exit 1
          SH

          chmod +x test_one.sh

      # =========================================================
      # Test candidates
      #
      # Maximum:
      #   300 candidates
      #   10 simultaneous Xray instances
      #
      # Only successful Gemini routes are collected.
      # =========================================================
      - name: Test Gemini connectivity
        run: |

          mkdir -p results
          rm -f results/*.txt

          if [ ! -s candidates_300.txt ]; then

            echo "No candidates found."

            touch tested.txt

          else

            split -l 1 candidates_300.txt test_input_

            counter=0
            running=0

            for file in test_input_*; do

              [ -f "$file" ] || continue

              counter=$((counter + 1))
              running=$((running + 1))

              (
                ./test_one.sh \
                  "$(cat "$file")" \
                  "$counter"
              ) > "results/$counter.txt" 2>/dev/null &

              # -------------------------------------------------
              # Maximum 10 simultaneous tests
              # -------------------------------------------------
              if (( running >= 10 )); then
                wait || true
                running=0
              fi

            done

            wait || true

            cat results/*.txt 2
