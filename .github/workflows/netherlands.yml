name: Netherlands

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Download
        run: |
          curl -L "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o all.txt

      - name: Get IPs
        run: |
          sed -n '1000,3000p' all.txt |
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' |
          sort -u > ips.txt

          echo "IPs:"
          wc -l ips.txt

      - name: Find Netherlands
        run: |
          > nl.txt

          split -l 100 ips.txt part_

          for p in part_*; do

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({"query": .})
            ' "$p" > request.json

            curl -s \
              -X POST \
              "http://ip-api.com/batch" \
              -H "Content-Type: application/json" \
              -d @request.json |
            jq -r '
              .[]
              | select(.country == "Netherlands")
              | .query
            ' >> nl.txt

            sleep 5
          done

          sort -u nl.txt -o nl.txt

          echo "Netherlands IPs:"
          wc -l nl.txt

      - name: Make Netherlands file
        run: |
          > Netherlands
          n=1

          while read line; do

            ip=$(echo "$line" |
              grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' |
              head -1)

            if grep -Fxq "$ip" nl.txt; then

              line="${line%%#*}"

              echo "$line#Netherlands $n" >> Netherlands

              n=$((n+1))

            fi

          done < <(sed -n '1000,3000p' all.txt)

          echo "Final:"
          wc -l Netherlands

      - name: Save
        run: |
          if [ ! -s Netherlands ]; then
            echo "No Netherlands configs found"
            exit 1
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Netherlands

          git diff --cached --quiet ||
          git commit -m "Update Netherlands"

          git push

      - name: Clean
        if: always()
        run: |
          rm -f all.txt ips.txt nl.txt request.json part_*
