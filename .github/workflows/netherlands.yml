name: Netherlands

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" \
            -o all.txt

          test -s all.txt

      - name: Select first 5000
        run: |
          head -n 5000 all.txt > range.txt

          echo "Lines:"
          wc -l range.txt

      - name: Get IPs
        run: |
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' range.txt |
          sort -u > ips.txt || true

          echo "Unique IPs:"
          wc -l ips.txt

      - name: Find Netherlands IPs
        run: |
          > nl.txt

          split -l 100 ips.txt part_

          for part in part_*; do

            [ -f "$part" ] || continue

            jq -R -s '
              split("\n")
              | map(select(length > 0))
            ' "$part" > request.json

            curl -s \
              -X POST \
              "http://ip-api.com/batch" \
              -H "Content-Type: application/json" \
              -d @request.json |
            jq -r '
              .[]
              | select(.status == "success")
              | select(.country == "Netherlands")
              | .query
            ' >> nl.txt

            sleep 2
          done

          sort -u nl.txt -o nl.txt

          echo "Netherlands IPs:"
          wc -l nl.txt

      - name: Create Netherlands
        run: |
          > Netherlands

          while IFS= read -r line; do

            ip=$(echo "$line" |
              grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' |
              head -1)

            if [ -n "$ip" ] &&
               grep -Fxq "$ip" nl.txt; then

              echo "$line" >> Netherlands

            fi

          done < range.txt

          echo "Netherlands configs:"
          wc -l Netherlands

          head -n 5 Netherlands

      - name: Save
        run: |
          if [ ! -s Netherlands ]; then
            echo "No Netherlands configs found"
            exit 1
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Netherlands

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Netherlands"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f all.txt
          rm -f range.txt
          rm -f ips.txt
          rm -f nl.txt
          rm -f request.json
          rm -f part_*
