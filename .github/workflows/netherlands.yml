name: Countries

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Download configs
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" \
            -o all.txt

          echo "Total lines:"
          wc -l < all.txt

      - name: Extract IPs
        run: |
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' all.txt |
          sort -u > ips.txt || true

          echo "Unique IPs:"
          wc -l < ips.txt

      - name: Detect countries
        run: |
          rm -f countries.txt
          touch countries.txt

          split -l 100 ips.txt part_

          for part in part_*; do
            [ -f "$part" ] || continue

            echo "Checking $(wc -l < "$part") IPs..."

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({query: .})
            ' "$part" > request.json

            curl -s \
              --max-time 60 \
              -X POST \
              "http://ip-api.com/batch" \
              -H "Content-Type: application/json" \
              --data-binary @request.json |
            jq -r '
              .[]
              | select(.status == "success")
              | "\(.query)|\(.country)"
            ' >> countries.txt || true

            sleep 5
          done

          echo "Country results:"
          wc -l < countries.txt

      - name: Create Netherlands
        run: |
          > Netherlands

          while IFS= read -r line; do
            ip=$(echo "$line" |
              grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' |
              head -1 || true)

            [ -z "$ip" ] && continue

            if grep -Fqx "$ip|Netherlands" countries.txt; then
              echo "$line" >> Netherlands
            fi
          done < all.txt

          echo "Netherlands configs:"
          wc -l < Netherlands

      - name: Create Turkey
        run: |
          > Turkey

          while IFS= read -r line; do
            ip=$(echo "$line" |
              grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' |
              head -1 || true)

            [ -z "$ip" ] && continue

            if grep -Fqx "$ip|Turkey" countries.txt; then
              echo "$line" >> Turkey
            fi
          done < all.txt

          echo "Turkey configs:"
          wc -l < Turkey

      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Netherlands Turkey

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Netherlands and Turkey"
            git push
          fi

      - name: Cleanup
        if: always()
        run: |
          rm -f all.txt
          rm -f ips.txt
          rm -f countries.txt
          rm -f request.json
          rm -f part_*
