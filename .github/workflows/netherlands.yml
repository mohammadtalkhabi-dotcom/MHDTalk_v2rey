name: Netherlands

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download subscription
        run: |
          set -e

          curl -fL --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" \
            -o all.txt

          echo "📥 Total configs:"
          wc -l < all.txt

          if [ ! -s all.txt ]; then
            echo "❌ فایل اصلی خالی است"
            exit 1
          fi

      - name: Extract server IPs
        run: |
          python3 <<'PY'
          import re
          import base64

          IP_RE = re.compile(
              r'\b(?:25[0-5]|2[0-4]\d|1?\d?\d)'
              r'(?:\.(?:25[0-5]|2[0-4]\d|1?\d?\d)){3}\b'
          )

          def decode_vmess(line):
              if not line.startswith("vmess://"):
                  return ""

              data = line[8:].split("#", 1)[0]
              data += "=" * (-len(data) % 4)

              try:
                  return base64.b64decode(data).decode(
                      "utf-8", errors="ignore"
                  )
              except Exception:
                  return ""

          ips = set()

          with open(
              "all.txt",
              "r",
              encoding="utf-8",
              errors="ignore"
          ) as f:

              for line in f:
                  line = line.strip()

                  if not line:
                      continue

                  ips.update(IP_RE.findall(line))

                  decoded = decode_vmess(line)

                  if decoded:
                      ips.update(IP_RE.findall(decoded))

          with open("unique_ips.txt", "w") as f:
              for ip in sorted(ips):
                  f.write(ip + "\n")

          print("🌐 Unique IPs:", len(ips))
          PY

          if [ ! -s unique_ips.txt ]; then
            echo "❌ هیچ IPای پیدا نشد"
            exit 1
          fi

      - name: Detect countries
        run: |
          set -e

          > country_map.txt

          split -l 100 unique_ips.txt ip_chunk_

          total=$(ls ip_chunk_* 2>/dev/null | wc -l)
          current=0

          for chunk in ip_chunk_*; do

            current=$((current + 1))

            echo "🔎 Batch $current / $total"

            jq -R -s '
              split("\n")
              | map(select(length > 0))
              | map({"query": .})
            ' "$chunk" > request.json

            response=$(curl -sS \
              --max-time 60 \
              --retry 3 \
              --retry-delay 2 \
              -X POST \
              "http://ip-api.com/batch" \
              -H "Content-Type: application/json" \
              --data-binary @request.json || true)

            if echo "$response" | jq -e 'type == "array"' >/dev/null 2>&1; then

              echo "$response" |
                jq -r '
                  .[]
                  | select(.status == "success")
                  | "\(.query)|\(.country)"
                ' >> country_map.txt

            else
              echo "⚠️ API response invalid"
            fi

            sleep 5
          done

          echo ""
          echo "🗺️ Mapped IPs:"
          wc -l < country_map.txt

          echo "🇳🇱 Netherlands IPs:"
          grep -c '|Netherlands$' country_map.txt || true

          if [ ! -s country_map.txt ]; then
            echo "❌ هیچ IPای شناسایی نشد"
            exit 1
          fi

      - name: Extract Netherlands configs
        run: |
          set -e

          > netherlands.txt

          awk -F'|' '$2 == "Netherlands" {print $1}' \
            country_map.txt > netherlands_ips.txt

          python3 <<'PY'
          import re
          import base64

          IP_RE = re.compile(
              r'\b(?:25
