name: Netherlands-Turkey

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Download subscription
        run: |
          curl -fL "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" -o all.txt
          echo "📥 تعداد کل: $(wc -l < all.txt)"

      - name: Detect countries
        run: |
          set +e

          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' all.txt | sort -u > unique_ips.txt

          echo "🌐 تعداد IP یکتا: $(wc -l < unique_ips.txt)"

          > country_map.txt

          if [ -s unique_ips.txt ]; then

            split -l 100 unique_ips.txt chunk_

            for chunk in chunk_*; do

              json=$(jq -R . < "$chunk" | jq -s . 2>/dev/null || echo '[]')

              response=$(curl -s \
                -X POST \
                "http://ip-api.com/batch" \
                -H "Content-Type: application/json" \
                -d "$json")

              if echo "$response" | jq -e . >/dev/null 2>&1; then

                echo "$response" |
                  jq -r '.[] | "\(.query)|\(.country // "Unknown")"' \
                  >> country_map.txt

              else

                while read ip; do
                  echo "$ip|Unknown"
                done < "$chunk" >> country_map.txt

              fi

              sleep 5

            done

            rm -f chunk_*

          fi

          > Netherlands
          > Turkey

          nl=1
          tr=1

          while IFS= read -r line; do

            [ -z "$line" ] && continue

            ip=$(echo "$line" |
              grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' |
              head -1)

            country="Unknown"

            if [ -n "$ip" ]; then
              country=$(grep "^$ip|" country_map.txt |
                cut -d'|' -f2 |
                head -1)

              [ -z "$country" ] && country="Unknown"
            fi

            # VMESS
            if [[ "$line" == vmess://* ]]; then

              encoded=$(echo "$line" | sed 's/vmess:\/\///')

              decoded=$(echo "$encoded" |
                base64 -d 2>/dev/null || echo '')

              if [ -n "$decoded" ] &&
                 echo "$decoded" | jq -e . >/dev/null 2>&1; then

                if [ "$country" = "Netherlands" ]; then
                  new_decoded=$(echo "$decoded" |
                    jq --arg name "Netherlands $nl" '.ps = $name')

                  new_encoded=$(echo "$new_decoded" |
                    base64 -w 0)

                  echo "vmess://$new_encoded" >> Netherlands

                  nl=$((nl + 1))
                fi

                if [ "$country" = "Turkey" ]; then
                  new_decoded=$(echo "$decoded" |
                    jq --arg name "Turkey $tr" '.ps = $name')

                  new_encoded=$(echo "$new_decoded" |
                    base64 -w 0)

                  echo "vmess://$new_encoded" >> Turkey

                  tr=$((tr + 1))
                fi

              else

                if [ "$country" = "Netherlands" ]; then
                  echo "${line%%#*}#Netherlands $nl" >> Netherlands
                  nl=$((nl + 1))
                fi

                if [ "$country" = "Turkey" ]; then
                  echo "${line%%#*}#Turkey $tr" >> Turkey
                  tr=$((tr + 1))
                fi

              fi

            else

              if [ "$country" = "Netherlands" ]; then
                echo "${line%%#*}#Netherlands $nl" >> Netherlands
                nl=$((nl + 1))
              fi

              if [ "$country" = "Turkey" ]; then
                echo "${line%%#*}#Turkey $tr" >> Turkey
                tr=$((tr + 1))
              fi

            fi

          done < all.txt

          echo ""
          echo "🇳🇱 Netherlands: $(wc -l < Netherlands)"
          echo "🇹🇷 Turkey: $(wc -l < Turkey)"

          echo ""
          echo "نمونه Netherlands:"
          head -n 3 Netherlands

          echo ""
          echo "نمونه Turkey:"
          head -n 3 Turkey

          rm -f unique_ips.txt country_map.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add Netherlands Turkey

          if git diff --cached --quiet; then
            echo "✅ بدون تغییر"
            exit 0
          fi

          git commit -m "Update Netherlands and Turkey"
          git push
