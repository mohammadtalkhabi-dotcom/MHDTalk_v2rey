name: NETHERLANDS200

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download subscription
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/Epodonios/v2ray-configs/main/All_Configs_Sub.txt" \
            -o all.txt

          echo "📥 تعداد کل کانفیگ‌ها:"
          wc -l < all.txt

      - name: Find IP addresses
        run: |
          grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' all.txt \
            | sort -u > unique_ips.txt

          echo "🌐 تعداد IP یکتا:"
          wc -l < unique_ips.txt

      - name: Detect Netherlands IPs
        run: |
          > country_map.txt

          if [ -s unique_ips.txt ]; then

            split -l 100 unique_ips.txt chunk_

            for chunk in chunk_*; do

              echo "🔎 بررسی $(wc -l < "$chunk") IP..."

              json=$(jq -R . < "$chunk" | jq -s .)

              response=$(curl -sS --max-time 30 \
                -X POST \
                "https://ip-api.com/batch" \
                -H "Content-Type: application/json" \
                -d "$json")

              if echo "$response" | jq -e 'type == "array"' >/dev/null 2>&1; then
                echo "$response" |
                  jq -r '
                    .[]
                    | select(.status == "success")
                    | "\(.query)|\(.country)"
                  ' >> country_map.txt
              else
                echo "⚠️ پاسخ نامعتبر از ip-api"
              fi

              sleep 2
            done

            rm -f chunk_*

          fi

          echo ""
          echo "🗺️ تعداد IPهای شناسایی‌شده:"
          wc -l < country_map.txt

          echo ""
          echo "🇳🇱 تعداد IPهای هلند:"
          grep -c '|Netherlands$' country_map.txt || true

      - name: Extract Netherlands configs
        run: |
          > netherlands.txt

          while IFS= read -r line; do

            [ -z "$line" ] && continue

            ip=$(echo "$line" |
              grep -oE '([0-9]{1,3}\.){3}[0-9]{1,3}' |
              head -1)

            [ -z "$ip" ] && continue

            country=$(awk -F'|' -v ip="$ip" \
              '$1 == ip {print $2; exit}' country_map.txt)

            if [ "$country" = "Netherlands" ]; then
              echo "$line" >> netherlands.txt
            fi

          done < all.txt

          echo ""
          echo "🇳🇱 تعداد کل کانفیگ‌های هلند:"
          wc -l < netherlands.txt

      - name: Pick 200 random configs
        run: |
          shuf netherlands.txt | head -n 200 > selected.txt

          echo ""
          echo "🎯 تعداد انتخاب‌شده:"
          wc -l < selected.txt

      - name: Rename configs
        run: |
          > SUBTEXT2

          count=1

          while IFS= read -r line; do

            [ -z "$line" ] && continue

            name="Netherlands $count"

            if [[ "$line" == vmess://* ]]; then

              encoded="${line#vmess://}"

              decoded=$(echo "$encoded" |
                base64 -d 2>/dev/null || true)

              if [ -n "$decoded" ] &&
                 echo "$decoded" | jq -e . >/dev/null 2>&1; then

                new_decoded=$(echo "$decoded" |
                  jq --arg name "$name" '.ps = $name')

                new_encoded=$(echo "$new_decoded" |
                  base64 -w 0)

                echo "vmess://$new_encoded" >> SUBTEXT2

              else
                echo "${line%%#*}#$name" >> SUBTEXT2
              fi

            else

              if [[ "$line" == *"#"* ]]; then
                echo "$line" |
                  sed "s/#[^#]*$/#$name/" >> SUBTEXT2
              else
                echo "$line#$name" >> SUBTEXT2
              fi

            fi

            count=$((count + 1))

            if [ "$count" -gt 200 ]; then
              break
            fi

          done < selected.txt

          echo ""
          echo "================================"
          echo "🇳🇱 فایل نهایی"
          echo "================================"
          echo "تعداد: $(wc -l < SUBTEXT2)"
          echo ""

          head -n 5 SUBTEXT2

      - name: Cleanup
        run: |
          rm -f all.txt
          rm -f unique_ips.txt
          rm -f country_map.txt
          rm -f netherlands.txt
          rm -f selected.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add SUBTEXT2

          if git diff --cached --quiet; then
            echo "✅ تغییری وجود ندارد"
            exit 0
          fi

          git commit -m "Update 200 Netherlands configs"
          git push
